openapi: "3.0.3"
info:
  title: Workflow Runtime HTTP API
  version: "1.4.1"
  description: |
    Current-state freeze of all runtime workflow HTTP endpoints.
    Based on commit c133118.

servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8989"

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness check
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: readyz
      summary: Readiness check (includes migration check)
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service not ready (e.g., migration mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /version:
    get:
      operationId: version
      summary: Service version metadata
      tags: [health]
      security: []
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /internal/v1/workflow-instances:
    post:
      operationId: createWorkflowInstance
      summary: Create a workflow instance
      tags: [instances]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowInstanceRequest"
      responses:
        "201":
          description: Instance created
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL of the created instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkflowInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "425":
          $ref: "#/components/responses/TooEarly"

  /internal/v1/workflow-instances/{workflowInstanceId}:
    get:
      operationId: getWorkflowInstanceDetail
      summary: Get workflow instance detail
      tags: [instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Instance detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/v1/workflow-instances/{workflowInstanceId}/transitions:
    post:
      operationId: executeTransition
      summary: Execute a workflow transition
      tags: [transitions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkflowInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteWorkflowTransitionRequest"
      responses:
        "200":
          description: Transition executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteWorkflowTransitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "425":
          $ref: "#/components/responses/TooEarly"

  /internal/v1/workflow-instances/{workflowInstanceId}/timeline:
    get:
      operationId: getTimeline
      summary: Get workflow instance event timeline
      tags: [timeline]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
        - name: after
          in: query
          schema:
            type: integer
            description: Event sequence cursor (numeric)
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /internal/v1/workflow-instances/{workflowInstanceId}/submissions:
    get:
      operationId: listSubmissionHistory
      summary: Get workflow instance submission history
      tags: [submissions]
      description: >
        Thin HTTP adapter over the existing list_submission_history query.
        Visibility (full / actor / historical-participant RETURN feedback) and
        pagination (TimeUuidCursor keyset) are owned entirely by the reused
        application query; this endpoint adds no authorization rules.
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
        - name: afterCreatedAt
          in: query
          schema:
            type: string
            format: date-time
          description: Forward cursor timestamp (must be paired with afterId).
        - name: afterId
          in: query
          schema:
            type: string
            format: uuid
          description: Forward cursor submission id (must be paired with afterCreatedAt).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Submission history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /internal/v1/workflow-instances/domain:
    get:
      operationId: listDomainInstances
      summary: List all instances in a domain (DOMAIN_OWNER only)
      tags: [domain-list]
      parameters:
        - name: domainId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: beforeCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: definitionKey
          in: query
          schema:
            type: string
        - name: lifecycle
          in: query
          schema:
            type: string
            enum: [active, terminal, all]
        - name: currentNodeKey
          in: query
          schema:
            type: string
        - name: assigneePrincipalId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated domain instance list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainInstancePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /internal/v1/worklists/assigned-to-me:
    get:
      operationId: listAssignedToMe
      summary: List work items assigned to the authenticated actor
      tags: [worklists]
      parameters:
        - name: beforeCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated worklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklistPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /internal/v1/worklists/creator-owned-drafts:
    get:
      operationId: listCreatorOwnedDrafts
      summary: List draft instances created by the authenticated actor
      tags: [worklists]
      parameters:
        - name: beforeCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated creator draft list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorDraftPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Agent Self-Projection ─────────────────────────────────────────────
  /internal/v1/principals/me:
    put:
      operationId: selfProject
      summary: Self-project authenticated agent identity
      tags: [principals]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Principal projected or already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfProjectionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Caller-scoped domain discovery ────────────────────────────────────
  /internal/v1/principals/me/domains:
    get:
      operationId: listMyDomains
      summary: List the caller's own domain memberships
      tags: [principals]
      description: >
        Returns every domain where the verified caller has an enabled
        DOMAIN_OWNER / DOMAIN_MEMBER binding, joined with the domain's
        basic info.  Caller-scoped: the subject comes exclusively from the
        bearer token; no path/query input identifies it.  Disabled
        bindings and disabled domains are excluded.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's domain memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDomainsList"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Domain Member Management ──────────────────────────────────────────
  /internal/v1/domains/{domainId}/members:
    get:
      operationId: listDomainMembers
      summary: List DOMAIN_MEMBER bindings for a domain
      tags: [domains]
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: beforeCreatedAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/v1/domains/{domainId}/members/{principalId}:
    put:
      operationId: addDomainMember
      summary: Add a principal as DOMAIN_MEMBER (must be self-projected)
      tags: [domains]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/PrincipalIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member added or already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAddResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeDomainMember
      summary: Remove a DOMAIN_MEMBER binding
      tags: [domains]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/PrincipalIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRemoveResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Domain Definition Management ──────────────────────────────────────
  /internal/v1/domains/{domainId}/definitions:
    get:
      operationId: listDomainDefinitions
      summary: List workflow definitions in a domain (DOMAIN_OWNER only)
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: beforeCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated definition list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionListPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      operationId: createDomainDefinition
      summary: Create a workflow definition (idempotent)
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDefinitionRequest"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Definition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "425":
          $ref: "#/components/responses/TooEarly"

  /internal/v1/domains/{domainId}/definitions/{definitionId}:
    get:
      operationId: getDomainDefinition
      summary: Get definition detail with all versions
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Definition detail with versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/v1/domains/{domainId}/definitions/{definitionId}/versions:
    post:
      operationId: createDefinitionVersion
      summary: Create a new DRAFT version (idempotent)
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftVersionRequest"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDraftVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "425":
          $ref: "#/components/responses/TooEarly"

  /internal/v1/domains/{domainId}/definitions/{definitionId}/draft:
    put:
      operationId: replaceDefinitionDraft
      summary: Replace the graph of a DRAFT version (idempotent)
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDraftGraphRequest"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft graph replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "425":
          $ref: "#/components/responses/TooEarly"

  /internal/v1/domains/{domainId}/definitions/{definitionId}/publish:
    post:
      operationId: publishDefinitionVersion
      summary: Publish a DRAFT version (idempotent)
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishVersionRequest"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "425":
          $ref: "#/components/responses/TooEarly"

  /internal/v1/domains/{domainId}/definitions/{definitionId}/archive:
    post:
      operationId: archiveDomainDefinition
      summary: Archive a workflow definition (idempotent)
      tags: [definitions]
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Definition archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDefinitionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "425":
          $ref: "#/components/responses/TooEarly"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[\\x21-\\x7e]+$"
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrincipalIdPath:
      name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowInstanceId:
      name: workflowInstanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # Error
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required: [code, message]
      required: [error]

    # Health
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required: [status]

    VersionResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          example: svc-workflow
        version:
          type: string
          example: "0.3.1"
        gitSha:
          type: string
        schemaVersion:
          type: string
          example: "0014"
        apiContractVersion:
          type: string
          example: internal-v0
      required: [service, version, gitSha, schemaVersion, apiContractVersion]

    # Request DTOs (camelCase)
    CreateWorkflowInstanceRequest:
      type: object
      additionalProperties: false
      required: [domainId, definitionVersionId, metadata, contextPayload]
      properties:
        domainId:
          type: string
          format: uuid
        definitionVersionId:
          type: string
          format: uuid
        externalReference:
          type: string
          maxLength: 512
        externalUrl:
          type: string
          format: uri
        metadata:
          type: object
        contextPayload:
          type: object

    ExecuteWorkflowTransitionRequest:
      type: object
      additionalProperties: false
      required: [transitionDefinitionId, expectedWorkflowStateVersion]
      properties:
        transitionDefinitionId:
          type: string
          format: uuid
        expectedWorkflowStateVersion:
          type: integer
        submissionPayload:
          type: object

    # Response DTOs (camelCase)
    CreateWorkflowInstanceResponse:
      type: object
      additionalProperties: false
      properties:
        workflowInstanceId:
          type: string
          format: uuid
        workflowStateVersion:
          type: integer
        currentContextRevisionId:
          type: string
          format: uuid
        currentNodeVisitId:
          type: string
          format: uuid
        eventSequence:
          type: integer
      required:
        - workflowInstanceId
        - workflowStateVersion
        - currentContextRevisionId
        - currentNodeVisitId
        - eventSequence

    ExecuteWorkflowTransitionResponse:
      type: object
      additionalProperties: false
      properties:
        workflowInstanceId:
          type: string
          format: uuid
        workflowStateVersion:
          type: integer
        currentContextRevisionId:
          type: string
          format: uuid
        sourceNodeVisitId:
          type: string
          format: uuid
        currentNodeVisitId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
          nullable: true
        eventSequence:
          type: integer
      required:
        - workflowInstanceId
        - workflowStateVersion
        - currentContextRevisionId
        - sourceNodeVisitId
        - currentNodeVisitId
        - submissionId
        - eventSequence

    # Detail (snake_case body in camelCase envelope)
    WorkflowInstanceDetailResponse:
      type: object
      additionalProperties: false
      properties:
        visibility:
          type: string
          enum: [full, historical_participant]
        detail:
          type: object
      required: [visibility, detail]

    # Timeline (camelCase)
    TimelineResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        nextCursor:
          type: integer
          nullable: true
      required: [items, nextCursor]

    TimelineEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        workflow_instance_id:
          type: string
          format: uuid
        event_sequence:
          type: integer
        event_schema_version:
          type: string
        command_id:
          type: string
          format: uuid
          nullable: true
        causation_id:
          type: string
          format: uuid
