components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[\\x21-\\x7e]+$"
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrincipalIdPath:
      name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowInstanceId:
      name: workflowInstanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssistanceCaseId:
      name: assistanceCaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BeforeCreatedAt:
      name: beforeCreatedAt
      in: query
      schema: { type: string, format: date-time }
    BeforeId:
      name: beforeId
      in: query
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  schemas:
    GraphValidationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [graph_validation_failed]
            message:
              type: string
              maxLength: 512
              description: Static correction prefixed by first rule name with underscores rendered as spaces; at most 512 UTF-8 bytes.
            details:
              type: object
              additionalProperties: false
              required: [errors, truncated]
              properties:
                truncated:
                  type: boolean
                errors:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        maxLength: 96
                        description: Exact canonical code from the accepted closed catalog, sorted and unique.
                      message:
                        type: string
                        maxLength: 350
                        description: Static ASCII correction, never raw engine or caller text.

    # Error
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required: [code, message]
      required: [error]

    # Health
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required: [status]

    VersionResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          example: svc-workflow
        version:
          type: string
          example: "0.3.1"
        gitSha:
          type: string
        schemaVersion:
          type: string
          example: "0014"
        apiContractVersion:
          type: string
          example: internal-v0
      required: [service, version, gitSha, schemaVersion, apiContractVersion]

    # Request DTOs (camelCase)
    CreateWorkflowInstanceRequest:
      type: object
      additionalProperties: false
      required: [domainId, definitionVersionId, metadata, contextPayload]
      properties:
        domainId:
          type: string
          format: uuid
        definitionVersionId:
          type: string
          format: uuid
        executionClass:
          type: string
          enum: [BUSINESS, NON_BUSINESS_TEST]
          description: >-
            Work execution class (SVC_WORKFLOW_WORK_EXECUTION_CLASS_V1).
            Optional; absent defaults to BUSINESS. NON_BUSINESS_TEST marks
            explicit test/canary work and is excluded from the normal
            BUSINESS automated dispatch due feed; marking it requires an
            enabled DOMAIN_OWNER binding on the target domain (403
            not_domain_owner otherwise).
        externalReference:
          type: string
          maxLength: 512
        externalUrl:
          type: string
          format: uri
        metadata:
          type: object
        contextPayload:
          type: object

    ExecuteWorkflowTransitionRequest:
      type: object
      additionalProperties: false
      required: [transitionDefinitionId, expectedWorkflowStateVersion]
      properties:
        contextPayload:
          type: object
          description: Full resulting Context; only managed INTAKE ADVANCE/RETURN entering a declared gate. Omission preserves the original command path; explicit null is invalid_input.
        transitionDefinitionId:
          type: string
          format: uuid
        expectedWorkflowStateVersion:
          type: integer
        submissionPayload:
          type: object

    # Response DTOs (camelCase)
    CreateWorkflowInstanceResponse:
      type: object
      additionalProperties: false
      properties:
        admissionObservation:
          $ref: "#/components/schemas/CreateAdmissionObservation"
        workflowInstanceId:
          type: string
          format: uuid
        workflowStateVersion:
          type: integer
        currentContextRevisionId:
          type: string
          format: uuid
        currentNodeVisitId:
          type: string
          format: uuid
        eventSequence:
          type: integer
      required:
        - workflowInstanceId
        - workflowStateVersion
        - currentContextRevisionId
        - currentNodeVisitId
        - eventSequence

    CreateAdmissionObservation:
      description: Immutable create-time admission, never a live readiness or dispatch
        source. Absent for prerequisite-free creates and legacy receipt replay.
      oneOf:
      - $ref: '#/components/schemas/CreateAdmissionWaitingObservation'
      - $ref: '#/components/schemas/CreateAdmissionReadyObservation'
    CreateAdmissionWaitingObservation:
      type: object
      additionalProperties: false
      required:
      - version
      - kind
      - status
      - dependentInstanceId
      - dependentDefinitionVersionId
      - initialContextRevisionId
      - initialContextSha256
      - initialVisitId
      - birthEventId
      - sourceInstanceId
      - sourceDefinitionVersionId
      - transitionId
      properties:
        version:
          type: integer
          enum:
          - 1
        kind:
          type: string
          enum:
          - TERMINAL_SUBMISSION
        status:
          type: string
          enum:
          - WAITING
        dependentInstanceId:
          type: string
          format: uuid
        dependentDefinitionVersionId:
          type: string
          format: uuid
        initialContextRevisionId:
          type: string
          format: uuid
        initialContextSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        initialVisitId:
          type: string
          format: uuid
        birthEventId:
          type: string
          format: uuid
        sourceInstanceId:
          type: string
          format: uuid
        sourceDefinitionVersionId:
          type: string
          format: uuid
        transitionId:
          type: string
          format: uuid
    CreateAdmissionReadyObservation:
      type: object
      additionalProperties: false
      required:
      - version
      - kind
      - status
      - dependentInstanceId
      - dependentDefinitionVersionId
      - initialContextRevisionId
      - initialContextSha256
      - initialVisitId
      - birthEventId
      - sourceInstanceId
      - sourceDefinitionVersionId
      - transitionId
      - eventId
      - submissionId
      - submissionSha256
      properties:
        version:
          type: integer
          enum:
          - 1
        kind:
          type: string
          enum:
          - TERMINAL_SUBMISSION
        status:
          type: string
          enum:
          - READY
        dependentInstanceId:
          type: string
          format: uuid
        dependentDefinitionVersionId:
          type: string
          format: uuid
        initialContextRevisionId:
          type: string
          format: uuid
        initialContextSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        initialVisitId:
          type: string
          format: uuid
        birthEventId:
          type: string
          format: uuid
        sourceInstanceId:
          type: string
          format: uuid
        sourceDefinitionVersionId:
          type: string
          format: uuid
        transitionId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        submissionSha256:
          type: string
          pattern: ^[0-9a-f]{64}$

    ExecuteWorkflowTransitionResponse:
      type: object
      additionalProperties: false
      properties:
        workflowInstanceId:
          type: string
          format: uuid
        workflowStateVersion:
          type: integer
        currentContextRevisionId:
          type: string
          format: uuid
        sourceNodeVisitId:
          type: string
          format: uuid
        currentNodeVisitId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
          nullable: true
        eventSequence:
          type: integer
      required:
        - workflowInstanceId
        - workflowStateVersion
        - currentContextRevisionId
        - sourceNodeVisitId
        - currentNodeVisitId
        - submissionId
        - eventSequence

    # Detail (snake_case body in camelCase envelope)
    WorkflowInstanceDetailResponse:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            visibility:
              type: string
              enum: [full]
            detail:
              $ref: "#/components/schemas/InstanceDetailWithAuthorizedActionsV1"
          required: [visibility, detail]
        - type: object
          additionalProperties: false
          properties:
            visibility:
              type: string
              enum: [historical_participant]
            detail:
              $ref: "#/components/schemas/HistoricalParticipantInstanceDetail"
          required: [visibility, detail]

    # Timeline (camelCase)
    TimelineResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        nextCursor:
          type: integer
          nullable: true
      required: [items, nextCursor]

    TimelineEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        workflow_instance_id:
          type: string
          format: uuid
        event_sequence:
          type: integer
        event_schema_version:
          type: string
        command_id:
          type: string
          format: uuid
          nullable: true
        causation_id:
          type: string
          format: uuid
          nullable: true
        correlation_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
        transition_effect:
          type: string
          nullable: true
        source_node_visit_id:
          type: string
          format: uuid
          nullable: true
        target_node_visit_id:
          type: string
          format: uuid
          nullable: true
        context_revision_id:
          type: string
          format: uuid
          nullable: true
        submission_id:
          type: string
          format: uuid
          nullable: true
        event_data:
          type: object
          nullable: true
        event_data_digest:
          type: string
          nullable: true
        actor_principal_id:
          type: string
          format: uuid
        from_node_id:
          type: string
          format: uuid
          nullable: true
        to_node_id:
          type: string
          format: uuid
          nullable: true
        old_workflow_state_version:
          type: integer
        new_workflow_state_version:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - event_id
        - workflow_instance_id
        - event_sequence
        - event_schema_version
        - command_id
        - causation_id
        - correlation_id
        - event_type
        - transition_effect
        - source_node_visit_id
        - target_node_visit_id
        - context_revision_id
        - submission_id
        - event_data
        - event_data_digest
        - actor_principal_id
        - from_node_id
        - to_node_id
        - old_workflow_state_version
        - new_workflow_state_version
        - created_at

    # Domain instance list (snake_case)
    DomainInstancePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DomainInstanceSummary"
        next_cursor:
          $ref: "#/components/schemas/Cursor"
      required: [items, next_cursor]

    DomainInstanceSummary:
      type: object
      additionalProperties: false
      properties:
        workflow_instance_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        definition_version_id:
          type: string
          format: uuid
        definition_key:
          type: string
        created_by_principal_id:
          type: string
          format: uuid
        current_assignee_principal_id:
          type: string
          format: uuid
          nullable: true
        current_node:
          $ref: "#/components/schemas/NodeSummary"
        execution_class:
          type: string
          enum: [BUSINESS, NON_BUSINESS_TEST]
          description: >-
            Work execution class (SVC_WORKFLOW_WORK_EXECUTION_CLASS_V1):
            BUSINESS, or NON_BUSINESS_TEST for explicitly marked
            test/canary work, which the normal BUSINESS dispatch due feed
            never returns. Class-only positive visibility; no private
            detail. Required on every post-deploy summary; pre-deploy
            binaries omit the field (deployment transition window).
        is_terminal:
          type: boolean
        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - workflow_instance_id
        - domain_id
        - definition_version_id
        - definition_key
        - created_by_principal_id
        - current_assignee_principal_id
        - execution_class
        - current_node
        - is_terminal
        - title
        - created_at
        - updated_at

    # Global instance list (snake_case) — DomainInstanceSummary contract
    # fields plus the additive nullable current_executor_type
    # (SVC_WORKFLOW_ACTIVE_AGENT_LIST_V2); wire shape is the flattened
    # domain summary plus the extra member.
    GlobalInstancePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlobalInstanceSummary"
        next_cursor:
          $ref: "#/components/schemas/Cursor"
      required: [items, next_cursor]

    GlobalInstanceSummary:
      type: object
      additionalProperties: false
      properties:
        workflow_instance_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        definition_version_id:
          type: string
          format: uuid
        definition_key:
          type: string
        created_by_principal_id:
          type: string
          format: uuid
        current_assignee_principal_id:
          type: string
          format: uuid
          nullable: true
        current_node:
          $ref: "#/components/schemas/NodeSummary"
        execution_class:
          type: string
          enum: [BUSINESS, NON_BUSINESS_TEST]
          description: >-
            Work execution class (SVC_WORKFLOW_WORK_EXECUTION_CLASS_V1):
            BUSINESS, or NON_BUSINESS_TEST for explicitly marked
            test/canary work, which the normal BUSINESS dispatch due feed
            never returns. Class-only positive visibility; no private
            detail. Required on every post-deploy summary; pre-deploy
            binaries omit the field (deployment transition window).
        is_terminal:
          type: boolean
        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_executor_type:
          type: string
          enum: [HUMAN, AGENT]
          nullable: true
          description: >-
            Canonical current executor type
            (SVC_WORKFLOW_ACTIVE_AGENT_LIST_V2), derived server-side from
            workflow_instances.current_node_visit_id ->
            workflow_node_visits.assignee_principal_id ->
            principals.principal_type in the same repeatable-read list
            snapshot. Always present on post-AAL binaries (null on
            terminal summaries); the only non-null values are HUMAN and
            AGENT, and a non-terminal current Visit whose Principal is
            neither is an internal consistency error, never a third
            value. No title, metadata, node-key, activation, eligibility,
