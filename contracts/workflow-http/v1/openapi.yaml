        node: { $ref: "#/components/schemas/AssistanceNodeSummary" }
        requestedByPrincipalId: { type: string, format: uuid }
        request: { $ref: "#/components/schemas/AssistancePayload" }
        escalation: { $ref: "#/components/schemas/AssistancePayload" }

    HumanRequiredAssistancePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HumanRequiredAssistanceCase" }
        nextCursor:
          allOf: [{ $ref: "#/components/schemas/AssistanceCursor" }]
          nullable: true

    # Shared
    Cursor:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
      required: [created_at, id]

    NodeSummary:
      type: object
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
        node_key:
          type: string
        display_name:
          type: string
        node_type:
          type: string
      required: [node_id, node_key, display_name, node_type]

    OwnerOperationDescriptor:
      type: object
      additionalProperties: false
      required:
      - key
      - version
      - hash
      properties:
        key:
          type: string
          enum:
          - workflow.create_instance
          - workflow.assistance.resolve_current_review
          - workflow.assistance.escalate_to_human
        version:
          type: integer
          enum:
          - 1
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
    OwnerOperationEffect:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - state
        properties:
          state:
            type: string
            enum:
            - NOT_STARTED
      - type: object
        additionalProperties: false
        required:
        - state
        - effectId
        properties:
          state:
            type: string
            enum:
            - PREPARED
            - STARTED
            - UNKNOWN
          effectId:
            type: string
            format: uuid
          requestDigest:
            type: string
            pattern: ^[0-9a-f]{64}$
          commandId:
            type: string
            format: uuid
      - type: object
        additionalProperties: false
        required:
        - state
        - effectId
        - commandId
        - requestDigest
        - result
        - resultDigest
        properties:
          state:
            type: string
            enum:
            - SUCCEEDED
          effectId:
            type: string
            format: uuid
          commandId:
            type: string
            format: uuid
          requestDigest:
            type: string
            pattern: ^[0-9a-f]{64}$
          result: {}
          resultDigest:
            type: string
            pattern: ^[0-9a-f]{64}$
      - type: object
        additionalProperties: false
        required:
        - state
        - effectId
        - commandId
        - requestDigest
        - failure
        properties:
          state:
            type: string
            enum:
            - REJECTED_ZERO_FACTS
          effectId:
            type: string
            format: uuid
          commandId:
            type: string
            format: uuid
          requestDigest:
            type: string
            pattern: ^[0-9a-f]{64}$
          failure:
            type: object
    OwnerCaseObligation:
      type: object
      additionalProperties: false
      required: [version, responsibilities]
      properties:
        version: { type: integer, enum: [1] }
        responsibilities:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OwnerCaseResponsibility" }
    OwnerCaseResponsibility:
      type: object
      additionalProperties: false
      required: [responsibilityId, kind, state]
      properties:
        responsibilityId: { type: string, format: uuid }
        kind: { type: string, enum: [INTAKE, REVIEW] }
        state: { type: string, enum: [PENDING, MATERIALIZED, BLOCKED_KNOWN, STOPPED, RETIRED, COMPLETED, UNKNOWN] }
        managedWorkflowInstanceId: { type: string, format: uuid }
        outcomeCode: { type: string }
        stop: { $ref: "#/components/schemas/OwnerObligationStop" }
    OwnerObligationStop:
      type: object
      additionalProperties: false
      required:
      - code
      - responsibilityId
      properties:
        code:
          type: string
        responsibilityId:
          type: string
          format: uuid
        ownerReplacementCommandId:
          type: string
          format: uuid
        nodeVisitId:
          type: string
          format: uuid
        attemptId:
          type: string
        effectId:
          type: string
          format: uuid
    OwnerReviewAdmission:
      type: object
      additionalProperties: false
      required:
      - version
      - status
      - source
      - owner
      - proof
      properties:
        version:
          type: integer
          enum:
          - 1
        status:
          type: string
          enum:
          - ADMISSIBLE
        source:
          type: object
          additionalProperties: false
          required:
          - workflowInstanceId
          - nodeVisitId
          - definitionVersionId
          properties:
            workflowInstanceId:
              type: string
              format: uuid
            nodeVisitId:
              type: string
              format: uuid
            definitionVersionId:
              type: string
              format: uuid
        owner:
          type: object
          additionalProperties: false
          required:
          - principalId
          - bindingId
          properties:
            principalId:
              type: string
              format: uuid
            bindingId:
              type: string
              format: uuid
        proof:
          type: object
          additionalProperties: false
          required:
          - bindingId
          - terminalEventId
          - submissionId
          - submissionDigest
          - acceptanceContractDigest
          properties:
            bindingId:
              type: string
              format: uuid
            terminalEventId:
              type: string
              format: uuid
            submissionId:
              type: string
              format: uuid
            submissionDigest:
              type: string
              pattern: ^[0-9a-f]{64}$
            acceptanceContractDigest:
              type: string
              pattern: ^[0-9a-f]{64}$
    OwnerCurrentOperation:
      type: object
      additionalProperties: false
      required:
      - slotKey
      - allowedOperations
      - effect
      properties:
        slotKey:
          type: string
          minLength: 1
        allowedOperations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OwnerOperationDescriptor'
        targetDefinitionVersionId:
          type: string
          format: uuid
        targetDefinitionDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        effect:
          $ref: '#/components/schemas/OwnerOperationEffect'
    OwnerCurrentNode:
      type: object
      additionalProperties: false
      required:
      - nodeVisitId
      - nodeDefinitionId
      - workflowStateVersion
      properties:
        nodeVisitId:
          type: string
          format: uuid
        nodeDefinitionId:
          type: string
          format: uuid
        workflowStateVersion:
          type: integer
          minimum: 1
        operation:
          $ref: '#/components/schemas/OwnerCurrentOperation'
        reviewAdmission:
          $ref: '#/components/schemas/OwnerReviewAdmission'
    OwnerObligationResponse:
      type: object
      additionalProperties: false
      required:
      - version
      - managedKind
      - workflowInstanceId
      - definitionVersionId
      - caseId
      - policyDigest
      - state
      properties:
        version:
          type: integer
          enum:
          - 1
        managedKind:
          type: string
          enum:
          - INTAKE
          - REVIEW
          - DEPENDENCY
        workflowInstanceId:
          type: string
          format: uuid
        definitionVersionId:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        policyDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        state:
          type: string
          enum:
          - ACTIVE
          - STOPPED
          - RETIRED
          - COMPLETED
        currentNode:
          $ref: '#/components/schemas/OwnerCurrentNode'
        stop:
          $ref: '#/components/schemas/OwnerObligationStop'
    OwnerOperationExecuteRequest:
      type: object
      additionalProperties: false
      required:
      - expectedWorkflowStateVersion
      - expectedSourceWorkflowStateVersion
      - operation
      - arguments
      properties:
        expectedWorkflowStateVersion:
          type: integer
          minimum: 1
        expectedSourceWorkflowStateVersion:
          type: integer
          minimum: 1
        operation:
          $ref: '#/components/schemas/OwnerOperationDescriptor'
        arguments:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - domainId
            - definitionVersionId
            - contextPayload
            - metadata
            properties:
              domainId:
                type: string
                format: uuid
              definitionVersionId:
                type: string
                format: uuid
              contextPayload: {}
              metadata: {}
              externalReference:
                type: string
              externalUrl:
                type: string
              executionClass:
                type: string
                enum:
                - BUSINESS
                - NON_BUSINESS_TEST
          - type: object
            additionalProperties: false
            required:
            - assistanceCaseId
            - expectedWorkflowStateVersion
            - resolution
            properties:
              assistanceCaseId:
                type: string
                format: uuid
              expectedWorkflowStateVersion:
                type: integer
                minimum: 1
              resolution:
                type: object
                additionalProperties: false
                required:
                - message
                properties:
                  supportingPayload: {}
                  message:
                    type: string
          - type: object
            additionalProperties: false
            required:
            - assistanceCaseId
            - expectedWorkflowStateVersion
            - escalation
            properties:
              assistanceCaseId:
                type: string
                format: uuid
              expectedWorkflowStateVersion:
                type: integer
                minimum: 1
              escalation:
                type: object
                additionalProperties: false
                required:
                - message
                properties:
                  supportingPayload: {}
                  message:
                    type: string
    OwnerOperationExecuteResponse:
      type: object
      additionalProperties: false
      required:
      - effectId
      - state
      - commandId
      - result
      - resultDigest
      - replayed
      properties:
        effectId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - SUCCEEDED
        commandId:
          type: string
          format: uuid
        result:
          oneOf:
          - $ref: '#/components/schemas/CreateWorkflowInstanceResponse'
          - $ref: '#/components/schemas/AssistanceCommandResponse'
        resultDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        replayed:
          type: boolean

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict (e.g., idempotency)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooEarly:
      description: Command still processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
