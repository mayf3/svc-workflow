              format: uuid
            transition_effect:
              type: string
              enum: [ADVANCE, RETURN, TERMINATE]
            request_validation:
              type: string
              enum: [REQUIRED_AT_EXECUTION]
          required: [operation, transition_id, transition_effect, request_validation]
        - type: object
          additionalProperties: false
          properties:
            operation:
              type: string
              enum: [request_assistance]
            request_validation:
              type: string
              enum: [REQUIRED_AT_EXECUTION]
          required: [operation, request_validation]
        - type: object
          additionalProperties: false
          properties:
            operation:
              type: string
              enum: [escalate_assistance]
            assistance_case_id:
              type: string
              format: uuid
            request_validation:
              type: string
              enum: [REQUIRED_AT_EXECUTION]
          required: [operation, assistance_case_id, request_validation]
        - type: object
