    InstanceDetailWithAuthorizedActionsV1:
      type: object
      additionalProperties: false
      description: >
        Endpoint-only full instance detail. Shared worklist and current-task-input
        details retain FullWorkflowInstanceDetail without these four fields.
      properties:
        instance:
          type: object
        current_context_revision_id:
          type: string
          format: uuid
        current_node_visit_id:
          type: string
          format: uuid
        current_context:
          type: object
        current_visit:
          type: object
        outgoing_transitions:
          type: array
        authorized_actions_scope:
          type: string
          enum: [INSTANCE_TASK_AND_GOVERNANCE_V1]
        authorized_actions_status:
          type: string
          enum:
            - AVAILABLE
            - NONE_FOR_ACTOR
            - MISSING_EXECUTE_SCOPE
            - WRITE_GATE_CLOSED
            - UNSUPPORTED_MODEL
          description: >
            Server-derived priority is MISSING_EXECUTE_SCOPE, WRITE_GATE_CLOSED,
            UNSUPPORTED_MODEL, then NONE_FOR_ACTOR or AVAILABLE. Actions are
            nonempty exactly for AVAILABLE; all other statuses carry an empty
            array. Existing authorization, consistency and storage errors take
            precedence over a successful response.
        authorized_actions:
          type: array
          items:
            $ref: "#/components/schemas/AuthorizedActionV1"
        current_task_type:
          $ref: "#/components/schemas/CurrentTaskTypeV1"
      required:
        - instance
        - current_context_revision_id
        - current_node_visit_id
        - current_context
        - current_visit
        - outgoing_transitions
        - authorized_actions_scope
        - authorized_actions_status
        - authorized_actions
        - current_task_type

